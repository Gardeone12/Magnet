item:
  name: "Переносной магнит"
  lore:
    - "Притягивает металлические предметы рядом."
    - "Держи в основной или второй руке."

command:
  help:
    - "/magnet - Показать помощь"
    - "/magnet give - Выдать переносной магнит"
    - "/magnet core create <id> [radius] [strength] - Создать медное магнитное ядро"
    - "/magnet core createat <id> <x> <y> <z> [radius] [strength] - Создать ядро по точным координатам"
    - "/magnet core remove <id> - Удалить магнитное ядро"
    - "/magnet core list - Показать магнитные ядра"
    - "/magnet core info <id> - Проверить, почему ядро не тянет предметы"
    - "/magnet core reload - Перезагрузить ядра из конфига"
  player-only: "Эту команду может выполнить только игрок."
  received: "Ты получил магнит."
  unknown: "Неизвестная команда магнита."
  invalid-number: "Радиус и сила должны быть положительными числами."
