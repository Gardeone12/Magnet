item:
  name: "Переносной магнит"
  lore:
    - "Притягивает металлические предметы рядом."
    - "Держи в основной или второй руке."

command:
  help:
    - "/magnet - Показать помощь"
    - "/magnet give - Выдать переносной магнит"
    - "/magnet core create <id> [radius] [strength] - Создать магнитное ядро 2x2x2"
    - "/magnet core createat <id> <x> <y> <z> [radius] [strength] - Создать ядро 2x2x2 по точным координатам"
    - "/magnet core remove <id> - Удалить магнитное ядро"
    - "/magnet core list - Показать магнитные ядра"
    - "/magnet core info <id> - Проверить, почему ядро не тянет предметы"
    - "/magnet core rescan <id> - Пересканировать каркас вокруг ядра"
    - "/magnet core refresh <id> - Пересчитать материалы ядра после замены"
    - "/magnet core override <id> <true|false> - Включить или выключить ручной radius/strength"
    - "/magnet core set <id> <radius|strength> <value> - Изменить значения конкретного ядра"
    - "/magnet core reload - Перезагрузить ядра из конфига"
    - "/magnet profile <list|info|set|reload> - Управлять профилями материалов ядра"
  player-only: "Эту команду может выполнить только игрок."
  received: "Ты получил магнит."
  unknown: "Неизвестная команда магнита."
