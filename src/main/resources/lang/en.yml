item:
  name: "Portable Magnet"
  lore:
    - "Attracts nearby metal items."
    - "Hold it in your main hand or off hand."

command:
  help:
    - "/magnet - Show this help"
    - "/magnet give - Give yourself a portable magnet"
    - "/magnet reload - Reload plugin config and magnetic cores"
    - "/magnet debug item - Show debug info for the item in your main hand"
    - "/magnet core create <id> [radius] [strength] - Create a 2x2x2 magnetic core"
    - "/magnet core createat <id> <x> <y> <z> [radius] [strength] - Create a 2x2x2 core at exact coordinates"
    - "/magnet core remove <id> - Remove a magnetic core"
    - "/magnet core list - List magnetic cores"
    - "/magnet core info <id> - Check why a core is not pulling items"
    - "/magnet core rescan <id> - Rescan the magnetic frame around a core"
    - "/magnet core refresh <id> - Recalculate core materials after replacement"
    - "/magnet core override <id> <true|false> - Toggle manual radius/strength override"
    - "/magnet core set <id> <radius|strength> <value> - Set one core's working values"
    - "/magnet core reload - Reload magnetic cores from config"
    - "/magnet profile <list|info|set|reload> - Manage core material profiles"
  player-only: "Only a player can use this command."
  received: "You received a magnet."
  reloaded: "Magnet plugin config and cores reloaded."
  unknown: "Unknown magnet command."
  invalid-number: "Radius and strength must be positive numbers."
  world-not-found: "World '{world}' was not found."
  debug-usage: "Usage: /magnet debug item"
  core-usage: "Usage: /magnet core <create|createat|remove|list|info|rescan|refresh|override|set|reload>"
