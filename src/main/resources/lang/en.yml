item:
  name: "Portable Magnet"
  lore:
    - "Attracts nearby metal items."
    - "Hold it in your main hand or off hand."

command:
  help:
    - "/magnet - Show this help"
    - "/magnet give - Give yourself a portable magnet"
    - "/magnet core create <id> [radius] [strength] - Create a copper magnetic core"
    - "/magnet core createat <id> <x> <y> <z> [radius] [strength] - Create a core at exact coordinates"
    - "/magnet core remove <id> - Remove a magnetic core"
    - "/magnet core list - List magnetic cores"
    - "/magnet core info <id> - Check why a core is not pulling items"
    - "/magnet core reload - Reload magnetic cores from config"
  player-only: "Only a player can use this command."
  received: "You received a magnet."
  unknown: "Unknown magnet command."
  invalid-number: "Radius and strength must be positive numbers."
  world-not-found: "World '{world}' was not found."
  core-usage: "Usage: /magnet core <create|createat|remove|list|info|reload>"
  core-create-usage: "Usage: /magnet core create <id> [radius] [strength]"
  core-createat-usage: "Usage: /magnet core createat <id> <x> <y> <z> [radius] [strength]"
  core-createat-console-usage: "Console usage: /magnet core createat <id> <world> <x> <y> <z> [radius] [strength]"
  core-remove-usage: "Usage: /magnet core remove <id>"
  core-info-usage: "Usage: /magnet core info <id>"
  core-id-invalid: "Core id can contain only a-z, 0-9, underscores, and hyphens."
  core-already-exists: "Magnetic core '{id}' already exists."
  core-need-copper: "Look at an allowed copper block to create a magnetic core."
  core-createat-not-copper: "The block at these coordinates is {material}, not an allowed copper core block."
  core-radius-clamped: "Radius was limited to {radius}."
  core-created: "Magnetic core '{id}' created at {world} {x} {y} {z}. Radius: {radius}, strength: {strength}."
  core-removed: "Magnetic core '{id}' removed."
  core-not-found: "Magnetic core '{id}' was not found."
  core-list-empty: "There are no magnetic cores."
  core-list-header: "Magnetic cores:"
  core-reloaded: "Magnetic cores reloaded from config."
